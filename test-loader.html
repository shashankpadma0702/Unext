<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loader Test</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: #f4f6f9;
      color: #1f1f1f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* LOADER */
    .loader-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 60vh;
      gap: 15px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #B02A30; /* Autumn Crimson */
      border-bottom-color: #F99D27; /* Sea Buckthorn */
      animation: spin 1.2s linear infinite, loaderGlow 1.5s alternate infinite ease-in-out;
      position: relative;
    }

    .spinner::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #F99D27; /* Sea Buckthorn */
      border-bottom-color: #B02A30; /* Autumn Crimson */
      animation: spin 0.8s linear infinite reverse;
    }

    .spinner::after {
      content: "";
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      background: rgba(249, 157, 39, 0.2);
      border-radius: 50%;
      animation: pulseCore 1.2s alternate infinite ease-in-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes loaderGlow {
      0% { box-shadow: 0 0 10px rgba(176, 42, 48, 0.2); }
      100% { box-shadow: 0 0 25px rgba(249, 157, 39, 0.6); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <div style="color: #B02A30; font-weight: 600; font-size: 15px; letter-spacing: 1px;">Loading...</div>
  </div>
</body>
</html>
